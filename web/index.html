<!doctype html>
<html>
  <head>
    <title>Read.Garden Core Viewer (dev)</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      li {
        padding: 0.5em;
      }
    </style>
  </head>
  <body>
    <script type="text/javascript">
      const url = new URL(document.location.toString());
      const server = url.searchParams.get('server');
      fetch(
        `${server ? decodeURIComponent(server) : 'http://localhost:3001'}/get-books`,
      ).then(async (res) => {
        const { books, cloudFrontUrl, ngrokUrl } = await res.json();
        if (cloudFrontUrl && books && books.length) {
          window.sessionStorage.setItem('rg_dev_cloudFrontUrl', cloudFrontUrl);
          if (ngrokUrl) {
            window.sessionStorage.setItem('rg_dev_ngrokUrl', ngrokUrl);
          } else {
            window.sessionStorage.removeItem('rg_dev_ngrokUrl');
          }
          const booksList = document.getElementById('books-list');
          if (booksList) {
            for (let i = 0, l = books.length; i < l; i++) {
              const book = books[i];
              if (book) {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = `/viewer.html?key=${book}`;
                a.title = book;
                a.textContent = book;
                li.appendChild(a);
                booksList.appendChild(li);
              }
            }
          }
        }
      });
    </script>
    <h1>Read.Garden Core Viewer</h1>
    <div>
      If you want to add some books for testing, check server env.<br />You'll
      also need to setup redis, CloudFront and project slug.
    </div>
    <ul id="books-list"></ul>
  </body>
</html>
